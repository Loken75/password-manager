<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Android — Détail mot de passe</title>
<link rel="stylesheet" href="android.css"><script src="../theme-toggle.js"></script></head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="dot-cam"></span><span>5G ▰▰▰ 84%</span></div>
  <div class="screen">
    <div class="appbar detail">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
      <div class="title">github.com</div>
      <svg class="ic" viewBox="0 0 24 24" fill="var(--fav)" stroke="var(--fav)" stroke-width="1.5"><path d="M12 3l2.7 5.5 6 .9-4.3 4.2 1 6-5.4-2.8-5.4 2.8 1-6L3.3 9.4l6-.9z"/></svg>
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </div>
    <div class="scroll">
      <div class="detail-head"><div class="avatar lg">G</div><div class="name">github.com</div><span class="badge b-vstrong"><span class="dot"></span>Très fort</span></div>
      <div class="field"><div class="k">Identifiant</div><div class="v"><span class="grow">alice@example.com</span><button class="iconbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button></div></div>
      <div class="field"><div class="k">Mot de passe</div><div class="v"><span class="grow mono">••••••••••••••••</span>
        <button class="iconbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="iconbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button></div>
        <div class="meter" style="margin-top:8px"><div class="track"><i style="width:92%;background:var(--vstrong)"></i></div><div class="cap"><span>Force</span><span>Très fort</span></div></div></div>
      <div class="field"><div class="k">URL</div><div class="v"><span class="grow" style="color:var(--accent)">https://github.com</span><button class="iconbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-9 9M10 6H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"/></svg></button></div></div>
      <div class="field"><div class="k">Catégorie</div><div class="v"><span class="grow">Travail</span></div></div>
      <div class="field"><div class="k">Notes</div><div class="v"><span class="grow muted">2FA activé · clé de récupération en coffre</span></div></div>
    </div>
  </div>
</div>
<div class="caption">Détail mot de passe — révélation explicite, copie, URL cliquable, jauge de force.</div>
</body></html>
