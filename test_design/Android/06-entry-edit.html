<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Android — Modifier mot de passe</title>
<link rel="stylesheet" href="android.css"><script src="../theme-toggle.js"></script></head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="dot-cam"></span><span>5G ▰▰▰ 84%</span></div>
  <div class="screen">
    <div class="appbar detail">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      <div class="title">Modifier l'entrée</div>
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--fav)" stroke-width="1.8"><path d="M12 3l2.7 5.5 6 .9-4.3 4.2 1 6-5.4-2.8-5.4 2.8 1-6L3.3 9.4l6-.9z"/></svg>
      <span style="color:var(--accent);font-weight:700;font-size:14px">Enreg.</span>
    </div>
    <div class="scroll">
      <label class="lbl" style="margin-top:0">Titre</label><input class="inp" value="github.com">
      <label class="lbl">Identifiant</label><input class="inp" value="alice">
      <label class="lbl">Email</label><input class="inp" value="alice@example.com">
      <label class="lbl">Mot de passe</label>
      <div class="field" style="margin-top:6px"><div class="v"><span class="grow mono">Tr0ub4dour&3xpl0it!</span>
        <button class="iconbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="iconbtn" title="Générer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg></button></div></div>
      <div class="meter" style="margin-top:8px"><div class="track"><i style="width:92%;background:var(--vstrong)"></i></div><div class="cap"><span>Force</span><span>Très fort</span></div></div>
      <label class="lbl">URL</label><input class="inp" value="https://github.com">
      <label class="lbl">Catégorie</label><div class="inp">Travail ▾</div>
      <label class="lbl">Tags</label><input class="inp" value="dev, 2fa">
      <label class="lbl">Notes</label><textarea class="inp">2FA activé · clé de récupération en coffre</textarea>
      <button class="btn btn-primary" style="margin-top:18px">Enregistrer</button>
    </div>
  </div>
</div>
<div class="caption">Édition mot de passe — formulaire, jauge inline, générateur intégré.</div>
</body></html>
