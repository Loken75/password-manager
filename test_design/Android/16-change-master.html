<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Android — Changer le mot de passe maître</title>
<link rel="stylesheet" href="android.css"><script src="../theme-toggle.js"></script></head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="dot-cam"></span><span>5G ▰▰▰ 84%</span></div>
  <div class="screen">
    <div class="appbar detail"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg><div class="title">Mot de passe maître</div></div>
    <div class="scroll">
      <label class="lbl" style="margin-top:0">Mot de passe actuel</label>
      <div class="field" style="margin-top:6px"><div class="v"><span class="grow mono">••••••••••</span><button class="iconbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
      <label class="lbl">Nouveau mot de passe</label>
      <div class="field" style="margin-top:6px"><div class="v"><span class="grow mono">N0uv34u&Coffre!2026</span></div></div>
      <div class="meter" style="margin-top:8px"><div class="track"><i style="width:90%;background:var(--vstrong)"></i></div><div class="cap"><span>Force</span><span>Très fort</span></div></div>
      <label class="lbl">Confirmer</label>
      <div class="field" style="margin-top:6px"><div class="v"><span class="grow mono">N0uv34u&Coffre!2026</span></div></div>
      <div class="section-card" style="margin-top:18px;display:flex;gap:12px;align-items:center;padding:14px 16px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        <span class="small muted">Quasi instantané (seule la DEK est re-chiffrée). La biométrie sera réinitialisée.</span></div>
      <button class="btn btn-primary" style="margin-top:18px">Changer le mot de passe</button>
    </div>
  </div>
</div>
<div class="caption">Changement du mot de passe maître — validation, force, note DEK/biométrie.</div>
</body></html>
