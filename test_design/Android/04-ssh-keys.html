<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Android — Clés SSH</title>
<link rel="stylesheet" href="android.css"><script src="../theme-toggle.js"></script></head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="dot-cam"></span><span>5G ▰▰▰ 84%</span></div>
  <div class="screen">
    <div class="appbar detail">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
      <div class="title">Clés SSH</div>
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M8 11l4 4 4-4M5 21h14"/></svg>
    </div>
    <div class="scroll">
      <p class="label">3 clés</p>
      <div class="cards">
        <div class="entry"><div class="avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4z"/><path d="m7 9 3 3-3 3"/></svg></div>
          <div class="meta"><div class="t">serveur-prod</div><div class="s mono small">SHA256:Xr3k…9aF1</div></div>
          <span class="badge" style="background:var(--surface-3);color:var(--text-2)">ED25519</span></div>
        <div class="entry"><div class="avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4z"/><path d="m7 9 3 3-3 3"/></svg></div>
          <div class="meta"><div class="t">backup-nas</div><div class="s mono small">SHA256:9bQ2…1cD8</div></div>
          <span class="badge" style="background:var(--surface-3);color:var(--text-2)">RSA</span></div>
        <div class="entry"><div class="avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4z"/><path d="m7 9 3 3-3 3"/></svg></div>
          <div class="meta"><div class="t">git-deploy</div><div class="s mono small">SHA256:Lm5p…7eR4</div></div>
          <span class="badge" style="background:var(--surface-3);color:var(--text-2)">ED25519</span></div>
      </div>
      <div class="btn-row" style="margin-top:18px;display:flex;gap:10px"><button class="btn btn-tonal">Importer</button><button class="btn btn-primary">Générer</button></div>
    </div>
  </div>
</div>
<div class="caption">Clés SSH — écran dédié (depuis les réglages) : liste, import PEM, génération ED25519/RSA.</div>
</body></html>
