<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Android — Gérer les catégories</title>
<link rel="stylesheet" href="android.css"><script src="../theme-toggle.js"></script></head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="dot-cam"></span><span>5G ▰▰▰ 84%</span></div>
  <div class="screen">
    <div class="appbar detail"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg><div class="title">Catégories</div></div>
    <div class="scroll">
      <div style="display:flex;gap:10px;margin-bottom:14px"><input class="inp" placeholder="Nouvelle catégorie…"><button class="btn btn-primary" style="width:auto;padding:13px 18px">Ajouter</button></div>
      <div class="section-card" style="padding:0">
        <div class="setting" style="padding:14px 16px"><span class="cat-dot" style="width:10px;height:10px;border-radius:50%;background:var(--text-3);margin-right:4px"></span><div class="grow sname">Travail</div><span class="muted small">9 entrées</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--weak)" stroke-width="2" style="margin-left:12px"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></div>
        <div class="setting" style="padding:14px 16px"><span style="width:10px;height:10px;border-radius:50%;background:var(--text-3);margin-right:4px"></span><div class="grow sname">Banque</div><span class="muted small">4 entrées</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--weak)" stroke-width="2" style="margin-left:12px"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></div>
        <div class="setting" style="padding:14px 16px"><span style="width:10px;height:10px;border-radius:50%;background:var(--text-3);margin-right:4px"></span><div class="grow sname">Réseaux sociaux</div><span class="muted small">7 entrées</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--weak)" stroke-width="2" style="margin-left:12px"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></div>
        <div class="setting" style="padding:14px 16px;border:0"><span style="width:10px;height:10px;border-radius:50%;background:var(--text-3);margin-right:4px"></span><div class="grow sname">Autre</div><span class="muted small">4 entrées</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--weak)" stroke-width="2" style="margin-left:12px"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></div>
      </div>
      <div class="small muted">La suppression réassigne les entrées concernées à « Autre ».</div>
    </div>
  </div>
</div>
<div class="caption">Gestion des catégories — ajout, suppression avec réassignation.</div>
</body></html>
