<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Android — Générateur</title>
<link rel="stylesheet" href="android.css"><script src="../theme-toggle.js"></script></head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="dot-cam"></span><span>5G ▰▰▰ 84%</span></div>
  <div class="screen">
    <div class="appbar"><div class="title">Générateur</div></div>
    <div class="scroll">
      <div class="section-card" style="padding:16px">
        <div class="mono" style="font-size:18px;letter-spacing:1px;word-break:break-all;line-height:1.5">Tr0ub4dour&3xpl0it!9z</div>
        <div class="meter" style="margin-top:12px"><div class="track"><i style="width:96%;background:var(--vstrong)"></i></div><div class="cap"><span>Force</span><span>Très fort</span></div></div>
        <div style="display:flex;gap:10px;margin-top:14px"><button class="btn btn-tonal">Régénérer</button><button class="btn btn-tonal">Copier</button></div>
      </div>
      <div class="section-card">
        <div class="setting" style="border:0"><div class="grow"><div class="sname">Longueur</div></div><div class="muted mono">20</div></div>
        <div class="slider" style="margin-top:0"><i style="width:60%"></i><b style="left:60%"></b></div>
        <div class="setting"><div class="grow"><div class="sname">Majuscules (A-Z)</div></div><div class="switch on"><i></i></div></div>
        <div class="setting"><div class="grow"><div class="sname">Minuscules (a-z)</div></div><div class="switch on"><i></i></div></div>
        <div class="setting"><div class="grow"><div class="sname">Chiffres (0-9)</div></div><div class="switch on"><i></i></div></div>
        <div class="setting"><div class="grow"><div class="sname">Spéciaux (!@#…)</div></div><div class="switch on"><i></i></div></div>
        <div class="setting" style="border:0"><div class="grow"><div class="sname">Exclure les ambigus</div><div class="sdesc">0/O, 1/l/I</div></div><div class="switch"><i></i></div></div>
      </div>
      <button class="btn btn-primary">Utiliser ce mot de passe</button>
    </div>
    <div class="botnav">
      <div class="item"><div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>Coffre</div>
      <div class="item active"><div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h10M4 12h16M4 17h7"/></svg></div>Générateur</div>
      <div class="item"><div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg></div>Audit</div>
      <div class="item"><div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7 7 0 0 0 0-2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-1.7-1l-.4-2.6H9l-.4 2.6a7 7 0 0 0-1.7 1l-2.3-1-2 3.4 2 1.5a7 7 0 0 0 0 2L2.6 14.5l2 3.4 2.3-1a7 7 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7 7 0 0 0 1.7-1l2.3 1 2-3.4z"/></svg></div>Réglages</div>
    </div>
  </div>
</div>
<div class="caption">Générateur — onglet dédié : résultat mono, longueur, options, force.</div>
</body></html>
