<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Android — Connexion</title>
<link rel="stylesheet" href="android.css"><script src="../theme-toggle.js"></script></head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="dot-cam"></span><span>5G ▰▰▰ 84%</span></div>
  <div class="screen">
    <div class="scroll" style="display:flex;flex-direction:column;justify-content:center;padding:24px">
      <div style="text-align:center;margin-bottom:24px">
        <div style="width:64px;height:64px;border-radius:18px;background:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 14px">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--on-accent)" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
        <div style="font-size:22px;font-weight:700">Gestionnaire de Mots de Passe</div>
        <div class="small muted" style="margin-top:4px">Version 1.5.0</div>
      </div>
      <label class="lbl" style="margin-top:0">Dossier de travail</label><div class="inp">Stockage interne ▾</div>
      <label class="lbl">Utilisateur</label><div class="inp">alice ▾</div>
      <label class="lbl">Mot de passe maître</label>
      <div class="field" style="margin-top:6px"><div class="v"><span class="grow mono">••••••••••</span>
        <button class="iconbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
      <button class="btn btn-primary" style="margin-top:18px">Déverrouiller</button>
      <button class="btn btn-tonal" style="margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 11c0 3-1 5-1 7M7 8a5 5 0 0 1 8-1M5 12a7 7 0 0 1 1-3M9 13c0 2-1 4-1 5M15 11c0 4-1 6-1 8M19 12a7 7 0 0 0-2-5"/></svg>
        Déverrouiller avec l'empreinte</button>
      <div style="text-align:center;color:var(--accent);font-weight:600;font-size:14px;margin-top:18px">Créer un nouvel utilisateur</div>
    </div>
  </div>
</div>
<div class="caption">Connexion — sélection du dossier, utilisateur, mot de passe maître + déverrouillage biométrique.</div>
</body></html>
