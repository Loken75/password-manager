<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>PC — Changer le mot de passe maître</title>
<style data-inlined="css">
/* "Calme & confiance" — desktop (PC) mockups. Accent steel blue #3B66C9.
   Tokens mirror docs/design-system/tokens.json (calm variant). Light = :root, dark = html.dark. */
:root{
  --bg:#E8ECF1; --surface:#FFFFFF; --surface-2:#F4F6F9; --surface-3:#E9EDF2;
  --border:#DCE2E9; --hairline:#ECEFF3;
  --text:#1A2230; --text-2:#5C6776; --text-3:#8A93A1;
  --accent:#3B66C9; --accent-weak:#EAF0FB; --accent-2:#2F559F; --on-accent:#FFFFFF;
  --strong:#2F9E68; --strong-bg:#E7F4ED;
  --medium:#B97D08; --medium-bg:#FBF1DD;
  --weak:#CF4747; --weak-bg:#FBEAEA;
  --vstrong:#2F6FB0; --vstrong-bg:#E7F0F9;
  --fav:#C79A33;
  --shadow:0 1px 2px rgba(20,28,40,.05),0 8px 22px rgba(20,28,40,.08);
  --shadow-sm:0 1px 2px rgba(20,28,40,.06);
  --shadow-pane:0 1px 3px rgba(20,28,40,.06);
  --r-win:14px; --r-card:14px; --r-btn:10px; --r-field:10px;
}
html.dark{
  --bg:#090D12; --surface:#161D26; --surface-2:#1E2731; --surface-3:#28323E;
  --border:#2A343F; --hairline:#222C36;
  --text:#E7ECF2; --text-2:#9AA6B4; --text-3:#6C7886;
  --accent:#6E92E8; --accent-weak:#1B2940; --accent-2:#86A6F0; --on-accent:#0B0F14;
  --strong:#46B883; --strong-bg:#16291F;
  --medium:#E0A23A; --medium-bg:#2A2113;
  --weak:#E36464; --weak-bg:#2C1717;
  --vstrong:#5E93D6; --vstrong-bg:#172435;
  --fav:#D9B95B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.45);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow-pane:0 1px 3px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);padding:32px;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,'SF Mono','JetBrains Mono','Roboto Mono',Consolas,monospace}
svg{display:block}
#theme-toggle{position:fixed;top:14px;right:16px;z-index:50;border:1px solid var(--border);
  background:var(--surface);color:var(--text-2);border-radius:99px;padding:7px 14px;font:600 12px/1 inherit;
  cursor:pointer;box-shadow:var(--shadow-sm)}

/* Window chrome */
.win{max-width:1180px;margin:0 auto;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-win);overflow:hidden;box-shadow:var(--shadow)}
.titlebar{height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--surface-2);
  border-bottom:1px solid var(--hairline)}
.titlebar .dots{display:flex;gap:7px}
.titlebar .dots i{width:11px;height:11px;border-radius:50%;background:var(--surface-3)}
.titlebar .title{flex:1;text-align:center;font-size:12px;color:var(--text-3)}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--hairline)}
.brand{font-size:17px;font-weight:700;letter-spacing:-.01em;padding-right:6px}
.search{flex:1;display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--r-field);padding:8px 12px;color:var(--text-3);max-width:520px}
.search input{border:0;outline:0;background:transparent;color:var(--text);font:14px/1 inherit;width:100%}
.toolbar .spacer{flex:1}

/* Layout */
.body{display:grid;grid-template-columns:230px 1fr 330px;min-height:620px}
.sidebar{border-right:1px solid var(--hairline);padding:14px 12px;background:var(--surface)}
.list-pane{border-right:1px solid var(--hairline);display:flex;flex-direction:column;background:var(--bg)}
.detail-pane{padding:20px;background:var(--surface);overflow:auto}

/* Sidebar nav */
.nav-group{margin-bottom:18px}
.nav-title{font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--text-3);text-transform:uppercase;margin:6px 8px 8px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-btn);color:var(--text-2);
  font-size:14px;font-weight:500;cursor:pointer;margin-bottom:2px}
.nav-item .ic{width:18px;height:18px;color:var(--text-3)}
.nav-item .count{margin-left:auto;font-size:12px;color:var(--text-3)}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--accent-weak);color:var(--accent);font-weight:600}
.nav-item.active .ic{color:var(--accent)}
.cat-dot{width:9px;height:9px;border-radius:50%;background:var(--text-3)}
.sidebar .foot{position:relative;margin-top:8px;border-top:1px solid var(--hairline);padding-top:10px}

/* List pane */
.list-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--hairline)}
.chip{font-size:12px;font-weight:600;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);
  border-radius:99px;padding:5px 12px;cursor:pointer}
.chip.active{background:var(--accent-weak);color:var(--accent);border-color:transparent}
.list{overflow:auto;padding:8px}
.bento{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:8px}
.bento .card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card);padding:14px;box-shadow:var(--shadow-pane)}
.bento .cap{font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--text-3);text-transform:uppercase}
.bento .big{font-size:26px;font-weight:700;margin:6px 0 2px;letter-spacing:-.02em}
.bento .sub{font-size:12px;color:var(--text-2)}
.health-bar{height:5px;border-radius:99px;background:var(--surface-3);margin-top:9px;overflow:hidden;display:flex}
.health-bar>i{height:100%}

/* Entry rows (desktop = denser rows) */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-card);cursor:pointer;position:relative}
.row:hover{background:var(--surface)}
.row.sel{background:var(--surface);box-shadow:var(--shadow-pane)}
.row .stripe{position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:99px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--surface-3);color:var(--text-2);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:0 0 auto;margin-left:6px}
.avatar.lg{width:56px;height:56px;font-size:22px}
.row .meta{flex:1;min-width:0}
.row .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-chip{font-size:11px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:99px;padding:3px 9px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%}
.b-strong{background:var(--strong-bg);color:var(--strong)} .b-strong .dot{background:var(--strong)}
.b-medium{background:var(--medium-bg);color:var(--medium)} .b-medium .dot{background:var(--medium)}
.b-weak{background:var(--weak-bg);color:var(--weak)} .b-weak .dot{background:var(--weak)}
.b-vstrong{background:var(--vstrong-bg);color:var(--vstrong)} .b-vstrong .dot{background:var(--vstrong)}
.star{width:18px;height:18px;flex:0 0 auto}

/* Detail pane */
.detail-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--hairline)}
.detail-head .name{font-size:18px;font-weight:700}
.field{margin-top:14px}
.field .k{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--text-3);text-transform:uppercase;margin-bottom:5px}
.field .v{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--r-field);padding:9px 10px;font-size:14px}
.field .v .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;border:0;
  background:transparent;color:var(--text-2);cursor:pointer}
.iconbtn:hover{background:var(--surface-3)}

/* Buttons */
.btn{border:0;cursor:pointer;border-radius:var(--r-btn);font:600 14px/1 inherit;padding:10px 16px}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-sm)}
.btn-tonal{background:var(--accent-weak);color:var(--accent)}
.btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border)}
.btn-sm{padding:7px 12px;font-size:13px}
.btn-row{display:flex;gap:10px;align-items:center}

/* Meter + secret */
.meter .track{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.meter .track>i{height:100%}
.meter .cap{font-size:12px;color:var(--text-2);margin-top:6px}

/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.inp{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-field);
  padding:10px 12px;color:var(--text);font:14px/1 inherit;outline:0}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.full{grid-column:1 / -1}
textarea.inp{min-height:72px;resize:vertical;font-family:inherit}

/* Dialog / modal */
.backdrop{min-height:560px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(0deg,var(--bg),var(--bg));padding:30px}
.dialog{width:520px;max-width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;
  box-shadow:var(--shadow);overflow:hidden}
.dialog.wide{width:680px}
.dialog .head{padding:18px 20px;border-bottom:1px solid var(--hairline);font-size:16px;font-weight:700}
.dialog .content{padding:20px}
.dialog .actions{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid var(--hairline)}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--hairline);padding:0 20px}
.tabs button{border:0;background:transparent;color:var(--text-2);font:600 13px/1 inherit;padding:14px 12px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}

/* Switch */
.switch{width:40px;height:24px;border-radius:99px;background:var(--surface-3);position:relative;flex:0 0 auto}
.switch.on{background:var(--accent)}
.switch i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch.on i{left:19px}
.setting{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--hairline)}
.setting .grow{flex:1}
.setting .sname{font-size:14px;font-weight:600}
.setting .sdesc{font-size:12.5px;color:var(--text-2);margin-top:2px}

/* Section + empty */
.section-title{font-size:13px;font-weight:700;color:var(--text);margin:18px 0 10px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px;text-align:center;color:var(--text-3);height:100%}
.empty .glyph{width:54px;height:54px;color:var(--text-3)}
.empty .et{font-size:16px;font-weight:600;color:var(--text)}

/* Login */
.login-wrap{min-height:640px;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:30px}
.login-card{width:420px;max-width:100%;background:var(--surface);border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--shadow);padding:34px}
.login-card .logo{width:52px;height:52px;border-radius:14px;background:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.login-card h1{font-size:21px;font-weight:700;text-align:center;margin:0}
.login-card .ver{text-align:center;color:var(--text-3);font-size:12px;margin:4px 0 22px}
.login-card .link{display:block;text-align:center;color:var(--accent);font-size:13px;font-weight:600;margin-top:14px;cursor:pointer}
.field-stack{margin-bottom:14px}

/* Audit / conflict helpers */
.audit-sec{border:1px solid var(--hairline);border-radius:var(--r-card);margin-bottom:12px;overflow:hidden}
.audit-sec .h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface-2);font-weight:600;font-size:14px}
.audit-sec .h .n{margin-left:auto;font-size:12px;color:var(--text-2)}
.audit-sec .item{padding:10px 14px;border-top:1px solid var(--hairline);font-size:13px;display:flex;gap:10px;align-items:center}
.conflict{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.conflict .side{border:1px solid var(--border);border-radius:var(--r-card);padding:14px}
.conflict .side.pick{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.muted{color:var(--text-2)} .small{font-size:12px}

</style><script data-inlined="toggle">
// Shared light/dark toggle for the calm "test_design" mockups.
// Injects a floating button; default theme = dark; choice persisted per browser.
(function () {
  function apply(theme) {
    document.documentElement.classList.toggle('dark', theme === 'dark');
  }
  var saved = (function () { try { return localStorage.getItem('calmTheme'); } catch (e) { return null; } }) ()
    || 'dark';
  apply(saved);
  window.addEventListener('DOMContentLoaded', function () {
    var btn = document.createElement('button');
    btn.id = 'theme-toggle';
    function label() { btn.textContent = document.documentElement.classList.contains('dark') ? 'Thème clair' : 'Thème sombre'; }
    label();
    btn.addEventListener('click', function () {
      var dark = !document.documentElement.classList.contains('dark');
      apply(dark ? 'dark' : 'light');
      try { localStorage.setItem('calmTheme', dark ? 'dark' : 'light'); } catch (e) {}
      label();
    });
    document.body.appendChild(btn);
  });
})();

</script></head>
<body>
<div class="backdrop">
  <div class="dialog">
    <div class="head">Changer le mot de passe maître</div>
    <div class="content">
      <label class="lbl">Mot de passe actuel</label>
      <div class="field" style="margin:0"><div class="v"><span class="grow mono">••••••••••</span><button class="iconbtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
      <label class="lbl" style="margin-top:14px">Nouveau mot de passe</label>
      <div class="field" style="margin:0"><div class="v"><span class="grow mono">N0uv34u&Coffre!2026</span><button class="iconbtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
      <div class="meter" style="margin-top:8px"><div class="track"><i style="width:90%;background:var(--vstrong)"></i></div><div class="cap">Très fort</div></div>
      <label class="lbl" style="margin-top:14px">Confirmer le nouveau mot de passe</label>
      <div class="field" style="margin:0"><div class="v"><span class="grow mono">N0uv34u&Coffre!2026</span></div></div>
      <div class="audit-sec" style="margin-top:16px"><div class="item" style="border:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span class="grow small muted">Opération quasi instantanée : seule la DEK est re-chiffrée. La biométrie sera réinitialisée.</span></div></div>
    </div>
    <div class="actions"><button class="btn btn-ghost">Annuler</button><button class="btn btn-primary">Changer</button></div>
  </div>
</div>
</body></html>
