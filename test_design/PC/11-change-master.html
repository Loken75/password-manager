<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>PC — Changer le mot de passe maître</title>
<link rel="stylesheet" href="pc.css"><script src="../theme-toggle.js"></script></head>
<body>
<div class="backdrop">
  <div class="dialog">
    <div class="head">Changer le mot de passe maître</div>
    <div class="content">
      <label class="lbl">Mot de passe actuel</label>
      <div class="field" style="margin:0"><div class="v"><span class="grow mono">••••••••••</span><button class="iconbtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
      <label class="lbl" style="margin-top:14px">Nouveau mot de passe</label>
      <div class="field" style="margin:0"><div class="v"><span class="grow mono">N0uv34u&Coffre!2026</span><button class="iconbtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
      <div class="meter" style="margin-top:8px"><div class="track"><i style="width:90%;background:var(--vstrong)"></i></div><div class="cap">Très fort</div></div>
      <label class="lbl" style="margin-top:14px">Confirmer le nouveau mot de passe</label>
      <div class="field" style="margin:0"><div class="v"><span class="grow mono">N0uv34u&Coffre!2026</span></div></div>
      <div class="audit-sec" style="margin-top:16px"><div class="item" style="border:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span class="grow small muted">Opération quasi instantanée : seule la DEK est re-chiffrée. La biométrie sera réinitialisée.</span></div></div>
    </div>
    <div class="actions"><button class="btn btn-ghost">Annuler</button><button class="btn btn-primary">Changer</button></div>
  </div>
</div>
</body></html>
