<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>PC — Générateur de mot de passe</title>
<link rel="stylesheet" href="pc.css"><script src="../theme-toggle.js"></script></head>
<body>
<div class="backdrop">
  <div class="dialog">
    <div class="head">Générateur de mot de passe</div>
    <div class="content">
      <div class="field" style="margin:0"><div class="v" style="padding:14px"><span class="grow mono" style="font-size:17px;letter-spacing:1px">Tr0ub4dour&3xpl0it!9z</span>
        <button class="iconbtn" title="Régénérer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg></button>
        <button class="iconbtn" title="Copier"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button></div></div>
      <div class="meter" style="margin-top:10px"><div class="track"><i style="width:96%;background:var(--vstrong)"></i></div><div class="cap">Très fort</div></div>

      <div style="margin-top:20px">
        <div class="setting" style="border:0;padding:6px 0"><div class="grow"><div class="sname">Longueur</div></div><div class="muted mono">20</div></div>
        <div class="slider"><i style="width:60%"></i><b style="left:60%"></b></div>
        <div class="setting"><div class="grow"><div class="sname">Majuscules (A-Z)</div></div><div class="switch on"><i></i></div></div>
        <div class="setting"><div class="grow"><div class="sname">Minuscules (a-z)</div></div><div class="switch on"><i></i></div></div>
        <div class="setting"><div class="grow"><div class="sname">Chiffres (0-9)</div></div><div class="switch on"><i></i></div></div>
        <div class="setting"><div class="grow"><div class="sname">Caractères spéciaux (!@#…)</div></div><div class="switch on"><i></i></div></div>
        <div class="setting" style="border:0"><div class="grow"><div class="sname">Exclure les ambigus</div><div class="sdesc">0/O, 1/l/I</div></div><div class="switch"><i></i></div></div>
      </div>
    </div>
    <div class="actions"><button class="btn btn-ghost">Fermer</button><button class="btn btn-primary">Utiliser</button></div>
  </div>
</div>
</body></html>
