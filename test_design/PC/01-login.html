<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>PC — Connexion</title>
<link rel="stylesheet" href="pc.css"><script src="../theme-toggle.js"></script></head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h1>Gestionnaire de Mots de Passe</h1>
    <div class="ver">Version 1.5.0</div>

    <div class="field-stack"><label class="lbl">Dossier de travail</label>
      <div style="display:flex;gap:8px"><div class="inp" style="flex:1">/var/home/pierre/…/vaults ▾</div><button class="btn btn-ghost btn-sm">…</button></div></div>
    <div class="field-stack"><label class="lbl">Utilisateur</label><div class="inp">alice ▾</div></div>
    <div class="field-stack"><label class="lbl">Mot de passe maître</label>
      <div class="field"><div class="v" style="background:var(--surface-2)"><span class="grow mono">••••••••••</span>
        <button class="iconbtn" title="Afficher"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div></div>

    <button class="btn btn-primary" style="width:100%;margin-top:6px">Connexion</button>
    <span class="link">Créer un nouvel utilisateur</span>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:22px;border-top:1px solid var(--hairline);padding-top:14px">
      <span class="small muted">Langue : Français ▾</span>
      <span class="link" style="margin:0">Vérifier les mises à jour</span>
    </div>
  </div>
</div>
</body></html>
