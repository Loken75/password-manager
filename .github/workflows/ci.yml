name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-core-desktop:
    name: Core + Desktop tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run core tests
        run: ./gradlew :core:test

      - name: Verify core coverage (JaCoCo gate)
        run: ./gradlew :core:jacocoTestCoverageVerification

      - name: Compile desktop
        run: ./gradlew :desktop:compileJava

      - name: Run desktop tests
        run: ./gradlew :desktop:test

  test-android:
    name: Android tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile Android
        run: ./gradlew :android:compileDebugKotlin

      - name: Run Android unit tests
        run: ./gradlew :android:testDebugUnitTest

      - name: Android Lint (gates new issues vs baseline)
        run: ./gradlew :android:lintDebug

  test-android-instrumented:
    name: Android instrumented tests (emulator)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The emulator needs hardware acceleration; expose /dev/kvm to the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Validates the real Keystore, EncryptedSharedPreferences and Compose UI.
      # Runs the androidTest suite on a headless emulator. The biometric-prompt
      # path is intentionally excluded (manual QA: docs/manual-qa-biometric.md).
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: ./gradlew :android:connectedDebugAndroidTest

  dependency-scan:
    name: Dependency vulnerability scan (SBOM + Trivy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # The aggregate SBOM resolves the :android release classpath, which needs the SDK.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxBom

      - name: Scan SBOM for known vulnerabilities (fails on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: sbom
          scan-ref: build/reports/bom.json
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: build/reports/bom.json
