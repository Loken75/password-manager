name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-core-desktop:
    name: Core + Desktop tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run core tests
        run: ./gradlew :core:test

      - name: Verify core coverage (JaCoCo gate)
        run: ./gradlew :core:jacocoTestCoverageVerification

      - name: Compile desktop
        run: ./gradlew :desktop:compileJava

      - name: Run desktop tests
        run: ./gradlew :desktop:test

  test-android:
    name: Android tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Android
        run: ./gradlew :android:compileDebugKotlin

      - name: Run Android unit tests
        run: ./gradlew :android:testDebugUnitTest

      - name: Android Lint (gates new issues vs baseline)
        run: ./gradlew :android:lintDebug
