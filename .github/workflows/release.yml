name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            archive_ext: tar.gz
          - os: windows-latest
            label: windows-x64
            archive_ext: zip
          - os: macos-latest
            label: macos-aarch64
            archive_ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test

      - name: Build fat JAR
        run: ./gradlew :desktop:fatJar

      - name: Create minimal JRE (jlink)
        shell: bash
        run: |
          jlink \
            --add-modules java.base,java.desktop,java.logging,java.naming,java.security.jgss,java.sql,java.xml \
            --strip-debug \
            --no-man-pages \
            --no-header-files \
            --compress zip-6 \
            --output dist/runtime

      - name: Assemble distribution
        shell: bash
        run: |
          cp desktop/build/libs/password-manager.jar dist/
          cp scripts/run.sh dist/
          cp scripts/run.bat dist/
          chmod +x dist/run.sh
          chmod +x dist/runtime/bin/*

      - name: Package archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: tar -czf password-manager-${{ steps.version.outputs.VERSION }}-${{ matrix.label }}.${{ matrix.archive_ext }} -C dist .

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath password-manager-${{ steps.version.outputs.VERSION }}-${{ matrix.label }}.${{ matrix.archive_ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: password-manager-${{ steps.version.outputs.VERSION }}-${{ matrix.label }}
          path: password-manager-${{ steps.version.outputs.VERSION }}-${{ matrix.label }}.${{ matrix.archive_ext }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Password Manager ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/password-manager-${{ steps.version.outputs.VERSION }}-linux-x64.tar.gz
            release-assets/password-manager-${{ steps.version.outputs.VERSION }}-windows-x64.zip
            release-assets/password-manager-${{ steps.version.outputs.VERSION }}-macos-aarch64.tar.gz
