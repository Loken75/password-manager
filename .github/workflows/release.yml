name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Desktop - ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            archive_ext: tar.gz
          - os: windows-latest
            label: windows-x64
            archive_ext: zip
          - os: macos-latest
            label: macos-aarch64
            archive_ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Inject version into build
        shell: bash
        run: |
          sed -i.bak "s/^appVersion=.*/appVersion=${{ steps.version.outputs.VERSION }}/" gradle.properties
          rm -f gradle.properties.bak

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test (core + desktop)
        run: ./gradlew :core:test :desktop:test

      - name: Build fat JAR
        run: ./gradlew :desktop:fatJar

      - name: Create minimal JRE (jlink)
        shell: bash
        run: |
          jlink \
            --add-modules java.base,java.desktop,java.logging,java.naming,java.security.jgss,java.sql,java.xml,jdk.crypto.ec \
            --strip-debug \
            --no-man-pages \
            --no-header-files \
            --compress zip-6 \
            --output dist/runtime

      - name: Assemble distribution
        shell: bash
        run: |
          cp desktop/build/libs/password-manager.jar dist/
          cp README.md dist/
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp scripts/run.bat dist/
          else
            cp scripts/run.sh dist/
            chmod +x dist/run.sh
          fi
          chmod +x dist/runtime/bin/*

      - name: Package archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: tar -czf password-manager-${{ steps.version.outputs.VERSION }}-${{ matrix.label }}.${{ matrix.archive_ext }} -C dist .

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath password-manager-${{ steps.version.outputs.VERSION }}-${{ matrix.label }}.${{ matrix.archive_ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: password-manager-${{ steps.version.outputs.VERSION }}-${{ matrix.label }}
          path: password-manager-${{ steps.version.outputs.VERSION }}-${{ matrix.label }}.${{ matrix.archive_ext }}
          retention-days: 1

  build-android:
    name: Android - APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Inject version into build
        shell: bash
        run: |
          sed -i.bak "s/^appVersion=.*/appVersion=${{ steps.version.outputs.VERSION }}/" gradle.properties
          rm -f gradle.properties.bak

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test (core + android)
        run: ./gradlew :core:test :android:testDebugUnitTest

      - name: Decode keystore
        run: |
          mkdir -p android/build
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/build/keystore.p12

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :android:assembleRelease

      - name: Rename APK
        run: mv android/build/outputs/apk/release/android-release.apk password-manager-${{ steps.version.outputs.VERSION }}-android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: password-manager-${{ steps.version.outputs.VERSION }}-android
          path: password-manager-${{ steps.version.outputs.VERSION }}-android.apk
          retention-days: 1

  build-sbom:
    name: SBOM - CycloneDX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Inject version into build
        shell: bash
        run: |
          sed -i.bak "s/^appVersion=.*/appVersion=${{ steps.version.outputs.VERSION }}/" gradle.properties
          rm -f gradle.properties.bak

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxBom

      - name: Rename SBOM
        run: mv build/reports/bom.json password-manager-${{ steps.version.outputs.VERSION }}-sbom.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: password-manager-${{ steps.version.outputs.VERSION }}-sbom
          path: password-manager-${{ steps.version.outputs.VERSION }}-sbom.json
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [build-desktop, build-android, build-sbom]
    runs-on: ubuntu-latest

    steps:
      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum *.tar.gz *.zip *.apk *-sbom.json > SHA256SUMS.txt

      # Detached GPG signatures authenticate each artifact. Optional: if the signing
      # key secret is not configured, the release proceeds unsigned with a warning.
      - name: Check for GPG signing key
        id: gpg
        env:
          # Passed via env (not interpolated into the script) so the multiline key
          # cannot break the shell.
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GPG_PRIVATE_KEY secret not set; release artifacts will be UNSIGNED."
          fi

      - name: Sign artifacts (GPG detached)
        if: steps.gpg.outputs.enabled == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          cd release-assets
          for f in *.tar.gz *.zip *.apk *-sbom.json SHA256SUMS.txt; do
            [ -e "$f" ] || continue
            gpg --batch --yes --pinentry-mode loopback \
                --passphrase "$GPG_PASSPHRASE" \
                --armor --detach-sign "$f"
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Password Manager ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/password-manager-${{ steps.version.outputs.VERSION }}-linux-x64.tar.gz
            release-assets/password-manager-${{ steps.version.outputs.VERSION }}-windows-x64.zip
            release-assets/password-manager-${{ steps.version.outputs.VERSION }}-macos-aarch64.tar.gz
            release-assets/password-manager-${{ steps.version.outputs.VERSION }}-android.apk
            release-assets/password-manager-${{ steps.version.outputs.VERSION }}-sbom.json
            release-assets/SHA256SUMS.txt
            release-assets/*.asc
